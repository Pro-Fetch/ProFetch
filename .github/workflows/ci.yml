name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs on the same branch to avoid wasting minutes on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The lower bound comes from `engines.node` (pdfjs-dist@6 requires >=22.13); the upper
        # bound is the current LTS line so new breaking majors surface as a job failure, not
        # silently later.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.13', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        # Strict on purpose: the prebuilt native binaries (`better-sqlite3`, `sharp`,
        # `@napi-rs/canvas`) exist for ubuntu and Windows, so a failed install is a real problem,
        # not flakiness. Letting it fail here keeps the cause visible instead of producing confusing
        # downstream failures in type-check, build or tests against a half-installed tree.
        run: npm ci

      - name: Dependency audit (production)
        # Gates the dependencies that actually ship in the published package. Dev-only advisories
        # (the vitest toolchain) are surfaced by the local `check`/`prepublishOnly` audit but must not
        # block a release; a HIGH or CRITICAL in the shipped runtime tree fails here.
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run lint

      - name: Format check
        # `check` and `prepublishOnly` gate on Prettier; running it here too means an unformatted PR
        # is red in CI instead of only failing the maintainers' local `npm run check` step.
        run: npm run format:check

      # Chromium for the browser tests, installed explicitly.
      #
      # `tests/pinned-proxy.test.ts` launches a real Chromium, and a runner with no browser binary for
      # this Playwright version fails there - a red CI job whose cause is the environment rather than
      # the commit. The `playwright` package downloads a browser in its own install script, which is
      # why this was ever missed: it works on a developer machine and on the ubuntu image's shared
      # cache, and fails on a fresh runner or after a version bump.
      #
      # `install-deps` is Linux-only and errors on Windows and macOS, so it is a separate guarded step
      # rather than `--with-deps`. Chromium alone is enough here: the test needs a browser to run, not
      # the whole cross-browser matrix, and the proxy code it covers is browser-agnostic.
      - name: Install Chromium
        run: npx playwright install chromium

      - name: Install OS packages Chromium needs
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium

      - name: Static verification
        run: npm run verify:static

      - name: Registry verification
        run: npm run verify:registry

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Verify the published tarball is executable and secret-free
        run: npm run verify:package

  # Enforces the Vitest coverage floors (statements/branches/functions/lines). Those thresholds only
  # take effect for a run that passes --coverage, which neither the matrix `npm test` nor CI did before,
  # so they were dead config. A single non-matrix job gates coverage without tripling runtime.
  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (browser tests)
        run: npx playwright install --with-deps chromium

      - name: Run tests with coverage
        run: npm run test:coverage

  # Alpine/musl is where the native binaries (`sharp`, `@napi-rs/canvas`, `better-sqlite3`)
  # usually fail to build. The server must still boot there and degrade to "this tool is
  # unavailable" rather than aborting at import time — which is exactly what a static import used
  # to do. This job asserts the degraded path: install without build scripts, compile, boot, and
  # verify the registry. The full suite does not run here because several tests exercise the native
  # modules themselves (SQLite seeding, real OCR); those run in the ubuntu/windows/macos matrix.
  alpine:
    name: Alpine (musl, degraded native deps)
    runs-on: ubuntu-latest
    container: node:24-alpine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Pure-JS install only: no compiler toolchain in the container, and the point of this job is
      # the host where native builds are absent. `tsc` and `tsx` are pure JS, so build and the
      # registry check below still run for real.
      - name: Install without build scripts
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # The server must boot with the native binaries absent, which is what a slim container or a
      # failed node-gyp build looks like. Removing what `--ignore-scripts` may still have placed
      # makes the simulation explicit rather than incidental.
      - name: Remove native media binaries to simulate a degraded host
        run: rm -rf node_modules/sharp node_modules/@napi-rs node_modules/tesseract.js node_modules/better-sqlite3

      - name: Server must boot without native binaries
        run: |
          node -e "import('./dist/server.js').then(()=>{console.log('BOOT_OK')}).catch(e=>{console.error('BOOT_FAIL',e.code||e.message);process.exit(1)})"

      - name: Static checks still pass without native binaries
        run: npm run verify:static

      - name: Registry still verifies
        run: npm run verify:registry

  # The Dockerfile and the HTTP door are the parts no local run can prove: this machine has no docker,
  # and a gateway that boots only on a developer's box is not a product. So CI builds the image and
  # speaks to a live server over the wire — health, a real call, the tier refusal, and MCP's tools/list.
  gateway:
    name: HTTP gateway and container
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Boot the gateway and call it over HTTP
        env:
          PRO_FETCH_PROFILE: full
          PRO_FETCH_HTTP_TIER: webdata
          PRO_FETCH_HTTP_KEYS_FILE: /tmp/keys.json
        run: |
          node dist/http/server.js &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/v1/health > /dev/null && break; sleep 1; done
          npm run http:key -- mint --label ci --profile full --tier webdata --limit 60 > /tmp/key.txt
          KEY=$(head -1 /tmp/key.txt)
          curl -sf http://127.0.0.1:8787/v1/health | grep -q '"exposed_tools"' || { echo "health missing exposed_tools"; exit 1; }
          curl -sf -X POST http://127.0.0.1:8787/v1/call \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"tool":"pro_encode_encode","input":{"text":"ci","alphabet":"base64"}}' | grep -q 'Y2k=' || { echo "call failed"; exit 1; }
          # A mutation must be refused by policy, with the reason — not executed, and not answered 502.
          STATUS=$(curl -s -o /tmp/refused.json -w '%{http_code}' -X POST http://127.0.0.1:8787/v1/call \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"tool":"pro_fetch_post_form","input":{}}')
          [ "$STATUS" = "403" ] && grep -q 'tool_not_for_sale' /tmp/refused.json || { echo "tier refusal wrong: $STATUS"; exit 1; }
          # The MCP door has to answer a real JSON-RPC handshake.
          curl -sf -X POST http://127.0.0.1:8787/mcp \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | grep -q 'pro_evidence_seal' || { echo "mcp tools/list wrong"; exit 1; }
          echo "GATEWAY_SMOKE_OK"

      - name: Build the container image
        run: docker build -t pro-fetch-ci .

      - name: The image must serve health
        run: |
          # A public bind refuses to start with zero keys, so the first start is a no-op whose only job
          # is to hold the container open while the compiled CLI mints the key into the volume.
          docker run -d --name pf -p 8788:8787 -v pf-data:/data \
            -e PRO_FETCH_HTTP_HOST=0.0.0.0 \
            -e PRO_FETCH_HTTP_KEYS_FILE=/data/http-keys.json \
            pro-fetch-ci sleep 600
          docker exec pf node dist/http/keygen.js mint --label container > /dev/null
          docker rm -f pf
          docker run -d --rm --name pf -p 8788:8787 -v pf-data:/data \
            -e PRO_FETCH_HTTP_HOST=0.0.0.0 \
            -e PRO_FETCH_HTTP_KEYS_FILE=/data/http-keys.json \
            pro-fetch-ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8788/v1/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8788/v1/health | grep -q '"service": "pro-fetch"' || { echo "container not serving"; docker logs pf; exit 1; }
          docker rm -f pf
          echo "CONTAINER_OK"

  publish-dry-run:
    name: Pack check
    runs-on: ubuntu-latest
    needs: [verify, alpine, coverage]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run