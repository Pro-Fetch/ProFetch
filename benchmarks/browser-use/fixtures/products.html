<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixtures — product list</title>
    <style>
      html,
      body {
        margin: 0;
        background: #fff;
        color: #111;
        font: 14px/1.4 system-ui;
      }
      ul.products {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      ul.products li {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid #ddd;
      }
      .swatch {
        width: 120px;
        height: 32px;
        background: #0040ff;
        border: 0;
        color: #fff;
      }
      .total {
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Cart</h1>
    <!-- Five rows that share a structure, on purpose: grouping must be derivable from shape alone. -->
    <ul class="products">
      <li>
        <img alt="Keyboard" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" />
        <span class="name">Keyboard</span>
        <span class="price">$49.00</span>
        <button class="swatch" data-row="1">Add Keyboard</button>
      </li>
      <li>
        <img alt="Monitor" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" />
        <span class="name">Monitor</span>
        <span class="price">$219.99</span>
        <button class="swatch" data-row="2">Add Monitor</button>
      </li>
      <li>
        <img alt="Webcam" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" />
        <span class="name">Webcam</span>
        <span class="price">$31.50</span>
        <button class="swatch" data-row="3">Add Webcam</button>
      </li>
      <li>
        <img alt="Headset" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" />
        <span class="name">Headset</span>
        <span class="price">$72.00</span>
        <button class="swatch" data-row="4">Add Headset</button>
      </li>
      <li>
        <img alt="Mouse" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" />
        <span class="name">Mouse</span>
        <span class="price">$19.95</span>
        <button class="swatch" data-row="5">Add Mouse</button>
      </li>
    </ul>
    <form class="total">
      <label for="qty">Quantity</label>
      <input id="qty" name="qty" value="1" />
      <button data-role="checkout">Checkout</button>
    </form>
  </body>
</html>
